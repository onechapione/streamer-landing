<body>
  <!-- EASTER EGG: botón B invisible (esquina superior izquierda) -->
  <button class="easter-egg" id="easter-egg-btn" aria-label="Easter egg secreto" title="Secret">
    B
  </button>

  <div class="container">
    <!-- Marcos de líneas + nombre en un wrapper para alinear todo -->
    <div class="name-frame-wrapper">
      <div class="frame-line frame-top"></div>
      <h1 class="name">

      </h1>

    </div>

    <!-- ============ BOTONES ============ -->
    <div class="buttons">
      <a href="https://instagram.com/onechapi" class="btn btn-instagram" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

      </a>
      <a href="https://twitch.tv/onechapi" class="btn btn-twitch" target="_blank" rel="noopener noreferrer">
        <!-- Twitch Glitch: SVG oficial del logo de Twitch (burbuja de chat + ojos) -->

          <rect x="8.5" y="5.417" width="2.083" height="5"/>
          <rect x="13.417" y="5.417" width="2.083" height="5"/>
        </svg>
        <span>Twitch</span>

    </div>

  <!-- ===== SOUND: Easter egg horror show tension (Web Audio API) ===== -->
  <script>
  (function() {
    'use strict';

    const btn = document.getElementById('easter-egg-btn');
    if (!btn) return;

    let audioCtx = null;
    let droneGain = null;
    let droneOsc = null;
    let noiseGain = null;
    let noiseNode = null;
    let filterNode = null;
    let lfoGain = null;
    let lfoOsc = null;
    let isPlaying = false;
    let animationId = null;

    // Volumen sutil pero audible — no molesta, pero se escucha
    const VOLUME = 0.14;
    // Frecuencia base del drone (grave, tensión)
    const BASE_FREQ = 72;
    // Frecuencia del LFO para vibrato del drone
    const LFO_FREQ = 0.18;

    function initAudio() {
      if (audioCtx) return;

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // ---- Drone: oscilador grave con vibrato ----
        droneOsc = audioCtx.createOscillator();
        droneOsc.type = 'sawtooth';
        droneOsc.frequency.value = BASE_FREQ;

        // Vibrato sutil (LFO controlando frecuencia del drone)
        lfoOsc = audioCtx.createOscillator();
        lfoOsc.type = 'sine';
        lfoOsc.frequency.value = LFO_FREQ;
        lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 2.5;
        lfoOsc.connect(lfoGain);
        lfoGain.connect(droneOsc.frequency);
        lfoOsc.start();

        // Filtro: low-pass que se abre/cierra para tensión dinámica
        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.value = 350;
        filterNode.Q.value = 2.5;

        // Rutina de animación para el filtro (oscila entre 180-480 Hz)
        function animateFilter() {
          if (!filterNode) return;
          const t = audioCtx.currentTime;
          // Segunda oscilación lenta del filtro (más lenta que el LFO)
          const lfo2 = Math.sin(t * 0.06) * 0.5 + 0.5;
          filterNode.frequency.value = 180 + lfo2 * 300;
          animationId = requestAnimationFrame(animateFilter);
        }

        droneOsc.connect(filterNode);
        filterNode.connect(audioCtx.destination);

        droneGain = audioCtx.createGain();
        droneGain.gain.value = 0;
        droneOsc.connect(droneGain);
        droneGain.connect(audioCtx.destination); // chain después del filter
        // Re-rout: droneOsc -> filterNode -> droneGain -> destination
        filterNode.disconnect();
        droneOsc.disconnect();
        droneOsc.connect(filterNode);
        filterNode.connect(droneGain);
        droneGain.connect(audioCtx.destination);

        droneOsc.start();

        // ---- Ruido: estática sutil de TV vieja ----
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.04;
        }

        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buffer;
        noiseNode.loop = true;

        noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0;

        // Filtro de ruido: high-pass sutil para que no sea blanco puro
        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.value = 800;
        noiseFilter.Q.value = 1.2;

        noiseNode.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        noiseNode.start();

        // ---- Reverb sutil (delay + feedback) ----
        const delayTime = 0.28;
        const delayNode = audioCtx.createDelay();
        delayNode.delayTime.value = delayTime;

        const feedbackGain = audioCtx.createGain();
        feedbackGain.gain.value = 0.12;

        const wetGain = audioCtx.createGain();
        wetGain.gain.value = 0;

        // Ruta: droneGain -> delayNode -> feedbackGain -> delayNode (loop) + wetGain -> destination
        droneGain.connect(delayNode);
        delayNode.connect(feedbackGain);
        feedbackGain.connect(delayNode);
        delayNode.connect(wetGain);
        wetGain.connect(audioCtx.destination);

        // Guardar referencias para controlar volumen del reverb
        droneGain._wetGain = wetGain;
        droneGain._feedbackGain = feedbackGain;

        // Iniciar animación del filtro
        animateFilter();

        // Volume inicial
        setVolume(0);

      } catch (e) {
        console.warn('Easter egg sound init failed:', e);
        audioCtx = null;
      }
    }

    function setVolume(v) {
      if (!droneGain) return;
      const clamped = Math.max(0, Math.min(1, v));
      droneGain.gain.setTargetAtTime(clamped * VOLUME, audioCtx.currentTime, 0.08);
      noiseGain.gain.setTargetAtTime(clamped * VOLUME * 0.3, audioCtx.currentTime, 0.08);
      if (droneGain._wetGain) {
        droneGain._wetGain.gain.setTargetAtTime(clamped * VOLUME * 0.4, audioCtx.currentTime, 0.1);
      }
    }

    // ---- Event listeners ----
    let hoverTimeout = null;

    btn.addEventListener('mouseenter', () => {
      if (!audioCtx) {
        initAudio();
        // Pequeño delay para que el contexto esté listo
        setTimeout(() => {
          if (audioCtx && !isPlaying) {
            isPlaying = true;
            setVolume(1);
          }
        }, 80);
      } else if (!isPlaying) {
        // Si el audioCtx existe pero se silenció, retomamos suave
        isPlaying = true;
        setVolume(1);
      }
    });

    btn.addEventListener('mouseleave', () => {
      isPlaying = false;
      if (droneGain) {
        setVolume(0);
      }
    });

    // Touch support (mobile)
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!audioCtx) {
        initAudio();
        setTimeout(() => {
          if (audioCtx && !isPlaying) {
            isPlaying = true;
            setVolume(1);
          }
        }, 80);
      } else if (!isPlaying) {
        isPlaying = true;
        setVolume(1);
      }
    });

    btn.addEventListener('touchend', () => {
      isPlaying = false;
      if (droneGain) setVolume(0);
    });

    // Cleanup al salir de página
    window.addEventListener('beforeunload', () => {
      if (animationId) cancelAnimationFrame(animationId);
      if (droneOsc) { try { droneOsc.stop(); } catch(e) {} }
      if (lfoOsc) { try { lfoOsc.stop(); } catch(e) {} }
      if (noiseNode) { try { noiseNode.stop(); } catch(e) {} }
      if (audioCtx && audioCtx.close) { audioCtx.close(); }
    });
  })();
  </script>
</body>
</html>
