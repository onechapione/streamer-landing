<body>
  <!-- EASTER EGG: botón B invisible (esquina superior izquierda) -->
  <button class="easter-egg" id="easter-egg-btn" aria-label="Easter egg secreto" title="Secret">
    B
  </button>

  <div class="container">
    <!-- Marcos de líneas + nombre en un wrapper para alinear todo -->
    <div class="name-frame-wrapper">
      <div class="frame-line frame-top"></div>
      <h1 class="name">
        <span class="name-text">Onechapi</span>
        <span class="name-glitch" aria-hidden="true">Onechapi</span>
      </h1>
      <div class="frame-line frame-bottom"></div>
    </div>

    <!-- ============ BOTONES ============ -->
    <div class="buttons">
      <a href="https://instagram.com/onechapi" class="btn btn-instagram" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        <span>Instagram</span>
      </a>
      <a href="https://twitch.tv/onechapi" class="btn btn-twitch" target="_blank" rel="noopener noreferrer">
        <!-- Twitch Glitch: SVG oficial del logo de Twitch (burbuja de chat + ojos) -->
        <svg class="logo-twitch" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 1.818L13.928 8.01L9.615 15.5L6.216 18.646L6.216 15.5L2 15.5L2 1.818L22 1.818L22 7.217L14.216 7.217L14.216 9.439L18.216 9.439L18.216 13.928L13.928 13.928L13.928 18.216L18.216 18.216L18.216 22.582L20 22.582L20 1.818z"/>
          <rect x="8.5" y="5.417" width="2.083" height="5"/>
          <rect x="13.417" y="5.417" width="2.083" height="5"/>
        </svg>
        <span>Twitch</span>
      </a>
    </div>

  </div>
