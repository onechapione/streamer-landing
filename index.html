  <!--
    SOUND SYSTEM v4 — Organo "Exorcista" + Shhhhh Misterioso
    Organo: múltiples harmonics (seno + sawtooth mezclados),
            notes graves punteando lentamente con ataque medio/decay largo.
    Shhhh: white noise → lowpass 800 Hz + notch 3kHz, modulado.
    Todo en volumen muy bajo, sutil, misterioso.
  -->
  <script>
  (function() {
    'use strict';

    console.log('[sound-v4] Script loaded');

    const btn = document.getElementById('easter-egg-btn');
    if (!btn) {
      console.warn('[sound-v4] Easter egg btn NOT found');
      return;
    }
    console.log('[sound-v4] Easter egg btn found');

    let audioCtx = null;
    let isMouseInside = false;

    // Volumen total muy bajo — misterio, no invasivo
    const VOLUME = 0.10;

    // === ORGANO ===
    let organOscs = [];     // múltiples osciladores para harmonics
    let organGain = null;    // gain del organo (volumen global)
    let organFilter = null;  // filtro para dar carácter "organo"
    let organSequencer = null; // LFO lento que "puntea" notas

    // === SHHHH ===
    let shhhSource = null;
    let shhhFilter = null;
    let shhhNotch = null;
    let shhhGain = null;
    let shhhLfo = null;
    let shhhLfoGain = null;

    // === MICRO-ECHO ===
    let echoDelay = null;
    let echoFeedback = null;
    let echoWet = null;

    // ====== INICIALIZAR ======
    function setupAudio() {
      if (audioCtx) return;
      if (document.hidden) return;

      console.log('[sound-v4] setupAudio() called');

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        console.log('[sound-v4] AudioContext created');

        // ====== ORGANO: múltiples harmonics ======
        // Notas graves punteando, inspiración Exorcista
        // Harmonics: fundamental + 2x + 3x + 4x (seno y sawtooth mezclados)
        // Frecuencias: una nota grave (ej: 55 Hz = A1) con sus armónicos

        const baseFreq = 55; // A1 — muy grave
        const harmonics = [
          { freq: baseFreq, type: 'sine', gain: 0.6 },     // fundamental
          { freq: baseFreq * 2, type: 'sine', gain: 0.25 }, // 2do armónico
          { freq: baseFreq * 3, type: 'sine', gain: 0.15 }, // 3er armónico
          { freq: baseFreq * 4, type: 'sawtooth', gain: 0.08 }, // 4to armónico (sawtooth para carácter "organo")
        ];

        organOscs = harmonics.map(h => {
          const osc = audioCtx.createOscillator();
          osc.type = h.type;
          osc.frequency.value = h.freq;
          osc.start();
          console.log('[sound-v4] organ osc:', h.freq, 'Hz', h.type);
          return osc;
        });

        organGain = audioCtx.createGain();
        organGain.gain.value = 0;

        organFilter = audioCtx.createBiquadFilter();
        organFilter.type = 'lowpass';
        organFilter.frequency.value = 500;
        organFilter.Q.value = 4;

        // Conectar: cada osc → organGain (mezclamos todos al mismo gain)
        organOscs.forEach(osc => {
          osc.connect(organFilter);
        });
        organFilter.connect(organGain);
        organGain.connect(audioCtx.destination);
        console.log('[sound-v4] organ chain connected');

        // ====== SEQUENCER: punteo lento ======
        // Intervalos de tiempo aleatorios entre 1.5 y 4 segundos
        // Cada 2-3 segundos, el organo "punta" una nota (attack medio → decay largo)
        // El sequencer controla el gain del organo con ataques suaves

        let nextNoteTime = 0;
        const minInterval = 1.5;
        const maxInterval = 4;
        const attackTime = 0.3;
        const decayTime = 1.8;

        function scheduleNextNote() {
          if (!audioCtx || !organGain) return;

          const now = audioCtx.currentTime;

          // Si estamos dentro de una nota activa, esperar a que termine
          if (nextNoteTime > now) {
            // Volver a programar en el futuro
            setTimeout(scheduleNextNote, (nextNoteTime - now) * 1000 + 50);
            return;
          }

          // Elegir intervalo aleatorio para la próxima nota
          const interval = minInterval + Math.random() * (maxInterval - minInterval);
          nextNoteTime = now + interval;

          // Ataque: subir el gain suavemente
          organGain.gain.setTargetAtTime(VOLUME * 0.5, now, 0.05);

          // Decay: bajar el gain lentamente después del attack
          const decayStart = now + attackTime;
          organGain.gain.setTargetAtTime(VOLUME * 0.08, decayStart, decayTime);

          console.log('[sound-v4] Organ note at', now.toFixed(2), 'interval:', interval.toFixed(2), 's');

          // Programar la próxima nota
          setTimeout(scheduleNextNote, interval * 1000 + 50);
        }

        // Empezar a schedulear después de un pequeño delay (para que el AudioContext esté listo)
        setTimeout(scheduleNextNote, 100);

        // ====== SHHHH ======
        const bufSize = audioCtx.sampleRate * 2;
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
          data[i] = (Math.random() * 2 - 1);
        }

        shhhSource = audioCtx.createBufferSource();
        shhhSource.buffer = buf;
        shhhSource.loop = true;

        shhhFilter = audioCtx.createBiquadFilter();
        shhhFilter.type = 'lowpass';
        shhhFilter.frequency.value = 700;
        shhhFilter.Q.value = 1.5;

        shhhNotch = audioCtx.createBiquadFilter();
        shhhNotch.type = 'notch';
        shhhNotch.frequency.value = 3000;
        shhhNotch.Q.value = 3;

        shhhGain = audioCtx.createGain();
        shhhGain.gain.value = 0;

        shhhSource.connect(shhhFilter);
        shhhFilter.connect(shhhNotch);
        shhhNotch.connect(shhhGain);
        shhhGain.connect(audioCtx.destination);

        shhhLfo = audioCtx.createOscillator();
        shhhLfo.type = 'sine';
        shhhLfo.frequency.value = 0.08;
        shhhLfoGain = audioCtx.createGain();
        shhhLfoGain.gain.value = 0.92;
        shhhLfo.connect(shhhLfoGain);
        shhhLfoGain.connect(shhhGain.gain);
        shhhLfo.start();

        console.log('[sound-v4] shhh ready');

        // ====== MICRO-ECHO ======
        echoDelay = audioCtx.createDelay();
        echoDelay.delayTime.value = 0.06;

        echoFeedback = audioCtx.createGain();
        echoFeedback.gain.value = 0.06;

        echoWet = audioCtx.createGain();
        echoWet.gain.value = 0;

        organGain.connect(echoDelay);
        shhhGain.connect(echoDelay);
        echoDelay.connect(echoFeedback);
        echoFeedback.connect(echoDelay);
        echoDelay.connect(echoWet);
        echoWet.connect(audioCtx.destination);

        console.log('[sound-v4] echo ready');

      } catch (e) {
        console.error('[sound-v4] ERROR:', e);
        audioCtx = null;
      }
    }

    // Establecer volumen global
    function setVolume(v) {
      if (!audioCtx) {
        console.warn('[sound-v4] setVolume: no AudioContext');
        return;
      }

      const t = audioCtx.currentTime;
      const clamped = Math.max(0, Math.min(1, v));

      console.log('[sound-v4] setVolume:', clamped);

      if (organGain) {
        organGain.gain.setTargetAtTime(clamped * VOLUME * 0.5, t, 0.05);
      }
      if (shhhGain) {
        shhhGain.gain.setTargetAtTime(clamped * VOLUME * 0.7, t, 0.04);
      }
      if (echoWet) {
        echoWet.gain.setTargetAtTime(clamped * VOLUME * 0.25, t, 0.08);
      }
    }

    // Evento: mouse entra → sonido inicia
    btn.addEventListener('mouseenter', () => {
      console.log('[sound-v4] mouseenter');

      isMouseInside = true;

      if (!audioCtx) {
        console.log('[sound-v4] AudioContext not ready, calling setupAudio()');
        setupAudio();
      } else {
        console.log('[sound-v4] AudioContext exists, state:', audioCtx.state);
        if (audioCtx.state === 'suspended') {
          console.log('[sound-v4] calling resume()');
          audioCtx.resume();
        }
      }

      setVolume(1);
    });

    // Evento: mouse sale → silenciar
    btn.addEventListener('mouseleave', () => {
      console.log('[sound-v4] mouseleave');
      isMouseInside = false;
      setVolume(0);
    });

    // Touch (mobile)
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      console.log('[sound-v4] touchstart');

      isMouseInside = true;

      if (!audioCtx) {
        setupAudio();
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      setVolume(1);
    });

    btn.addEventListener('touchend', () => {
      console.log('[sound-v4] touchend');
      isMouseInside = false;
      setVolume(0);
    });

    // Cleanup
    window.addEventListener('beforeunload', () => {
      if (audioCtx) {
        try { audioCtx.close(); } catch (e) {}
      }
    });
  })();
  </script>
