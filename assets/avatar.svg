<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="140" height="140">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#2A1555"/>
      <stop offset="60%"  stop-color="#0D0D12"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>

  <!-- Glow suavizado -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)"/>

  <!-- Sombra borde -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Silueta estilizada de perfil (generica, no facial) -->
  <g fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- contorno cabeza -->
    <path d="M100 52 C 62 52, 38 76, 38 104 C 38 122, 48 134, 62 140
             L 58 152 L 142 152 L 138 140
             C 152 134, 162 122, 162 104 C 162 76, 138 52, 100 52 Z"/>
    <!-- línea de mandíbula sutil -->
    <path d="M75 138 Q 100 150, 125 138" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- oído izquierdo -->
    <path d="M38 100 Q 28 100, 26 92"/>
    <!-- oído derecho -->
    <path d="M162 100 Q 172 100, 174 92"/>
    <!-- detalle tecnológico: rayo vertical -->
    <line x1="100" y1="52" x2="100" y2="38" stroke="#B91C1C" stroke-width="2"/>
    <!-- dots decorativos -->
    <circle cx="70"  cy="82" r="2" fill="#7C3AED" stroke="none"/>
    <circle cx="130" cy="82" r="2" fill="#B91C1C" stroke="none"/>
    <circle cx="100" cy="64" r="2" fill="#E5E5E5" stroke="none" opacity="0.5"/>
  </g>

  <!-- Texto iniciales -->
  <text x="100" y="118"
        font-family="Segoe UI, system-ui, sans-serif"
        font-size="34"
        font-weight="900"
        fill="#E5E5E5"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-1">
    N
  </text>

  <!-- Subtítulo iniciales pequeño -->
  <text x="100" y="142"
        font-family="Segoe UI, system-ui, sans-serif"
        font-size="9"
        font-weight="600"
        fill="#7C3AED"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="2">
    STREAMER
  </text>
</svg>
